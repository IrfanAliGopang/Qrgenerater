<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic QR Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-main: #0B0F19;
      --bg-card: rgba(18, 24, 38, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-blue: #0088FF;
      --accent-red: #FF2E55;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --glow-blue: rgba(0, 136, 255, 0.25);
      --glow-red: rgba(255, 46, 85, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 136, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 46, 85, 0.12) 0%, transparent 40%);
    }

    header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFF 30%, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--accent-blue);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .app-container {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 25px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .controls-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label i {
      color: var(--accent-blue);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px var(--glow-blue);
    }

    .color-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 12px;
    }

    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    .file-upload-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      background: rgba(255, 46, 85, 0.05);
      border: 1px dashed var(--accent-red);
      border-radius: 12px;
      color: var(--accent-red);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .file-upload-btn:hover {
      background: rgba(255, 46, 85, 0.15);
    }

    .file-upload-btn input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .preview-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 25px;
    }

    .qr-wrapper {
      position: relative;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    #qrcode-hidden {
      display: none;
    }

    .center-logo {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: none;
      pointer-events: none;
    }

    .btn-download {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-red));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 46, 85, 0.4);
    }

    footer {
      margin-top: 25px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (max-width: 850px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>QR Code Generator</h1>
    <p>Code with Irfan Ali Gopang</p>
  </header>

  <main class="app-container">
    <!-- Settings Controls -->
    <section class="controls-section">
      <div class="input-group">
        <label for="qr-text"><i class="fa-solid fa-link"></i> Content or URL</label>
        <input type="text" id="qr-text" value="https://github.com" placeholder="Type text or link here...">
      </div>

      <div class="color-grid">
        <div class="input-group">
          <label><i class="fa-solid fa-palette"></i> QR Accent Color</label>
          <div class="color-picker-wrapper">
            <input type="color" id="qr-color" value="#0088FF">
            <span id="qr-color-hex">#0088FF</span>
          </div>
        </div>

        <div class="input-group">
          <label><i class="fa-solid fa-fill-drip"></i> Background Color</label>
          <div class="color-picker-wrapper">
            <input type="color" id="bg-color" value="#121826">
            <span id="bg-color-hex">#121826</span>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label><i class="fa-solid fa-image"></i> Center Logo Image</label>
        <label class="file-upload-btn">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span id="file-label">Upload Image</span>
          <input type="file" id="logo-input" accept="image/*">
        </label>
      </div>
    </section>

    <!-- Visual Output -->
    <section class="preview-section">
      <div class="qr-wrapper" id="qr-wrapper">
        <div id="qrcode"></div>
        <div id="qrcode-hidden"></div>
        <img id="center-logo" class="center-logo" alt="Logo Overlay">
      </div>

      <button class="btn-download" id="download-btn">
        <i class="fa-solid fa-download"></i> Download High-Res QR
      </button>
    </section>
  </main>

  <footer>
    Created By <strong>Code with Irfan Ali G</strong>
  </footer>

  <script>
    const qrText = document.getElementById('qr-text');
    const qrColor = document.getElementById('qr-color');
    const bgColor = document.getElementById('bg-color');
    const qrColorHex = document.getElementById('qr-color-hex');
    const bgColorHex = document.getElementById('bg-color-hex');
    const logoInput = document.getElementById('logo-input');
    const centerLogo = document.getElementById('center-logo');
    const fileLabel = document.getElementById('file-label');
    const downloadBtn = document.getElementById('download-btn');
    const qrContainer = document.getElementById('qrcode');
    const qrWrapper = document.getElementById('qr-wrapper');

    let uploadedImgObj = null;

    function renderQR() {
      qrContainer.innerHTML = "";
      qrWrapper.style.backgroundColor = bgColor.value;

      // Render high-readability QR code
      new QRCode(qrContainer, {
        text: qrText.value.trim() || "https://github.com",
        width: 220,
        height: 220,
        colorDark: qrColor.value,
        colorLight: bgColor.value,
        correctLevel: QRCode.CorrectLevel.H 
      });
    }

    // Input listeners
    qrText.addEventListener('input', renderQR);

    qrColor.addEventListener('input', (e) => {
      qrColorHex.innerText = e.target.value.toUpperCase();
      renderQR();
    });

    bgColor.addEventListener('input', (e) => {
      bgColorHex.innerText = e.target.value.toUpperCase();
      renderQR();
    });

    // Handle Logo Upload
    logoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileLabel.innerText = file.name.length > 15 ? file.name.substring(0, 12) + "..." : file.name;
        const reader = new FileReader();
        reader.onload = (event) => {
          uploadedImgObj = new Image();
          uploadedImgObj.src = event.target.result;
          uploadedImgObj.onload = () => {
            centerLogo.src = event.target.result;
            centerLogo.style.borderColor = bgColor.value;
            centerLogo.style.display = "block";
          };
        };
        reader.readAsDataURL(file);
      }
    });

    // Perfect Download Generator (Direct Offscreen Canvas Stitching)
    downloadBtn.addEventListener('click', () => {
      const qrCanvas = qrContainer.querySelector('canvas');
      const qrImg = qrContainer.querySelector('img');
      const activeQR = qrCanvas || qrImg;

      if (!activeQR) return;

      const exportCanvas = document.createElement('canvas');
      const ctx = exportCanvas.getContext('2d');
      const size = 500; // Crisp export dimension
      const padding = 40;

      exportCanvas.width = size + (padding * 2);
      exportCanvas.height = size + (padding * 2);

      // 1. Draw Full Canvas Background
      ctx.fillStyle = bgColor.value;
      ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

      // 2. Draw QR Code Layer
      ctx.drawImage(activeQR, padding, padding, size, size);

      // 3. Draw Center Logo Layer (if uploaded)
      if (uploadedImgObj) {
        const logoSize = size * 0.22;
        const centerX = (exportCanvas.width - logoSize) / 2;
        const centerY = (exportCanvas.height - logoSize) / 2;

        // Outer Border Ring
        ctx.save();
        ctx.beginPath();
        ctx.arc(exportCanvas.width / 2, exportCanvas.height / 2, (logoSize / 2) + 6, 0, Math.PI * 2);
        ctx.fillStyle = bgColor.value;
        ctx.fill();

        // Circular Image Clip
        ctx.beginPath();
        ctx.arc(exportCanvas.width / 2, exportCanvas.height / 2, logoSize / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(uploadedImgObj, centerX, centerY, logoSize, logoSize);
        ctx.restore();
      }

      // 4. Download Execution
      const link = document.createElement('a');
      link.download = 'code-with-irfan-qr.png';
      link.href = exportCanvas.toDataURL('image/png', 1.0);
      link.click();
    });

    // Initial Execution
    renderQR();
  </script>
</body>
</html>
